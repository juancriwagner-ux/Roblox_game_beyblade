# Selene linter config — Luau + Roblox globals.
# On a normal machine selene downloads the Roblox std automatically
# (`selene src/`). In offline/sandboxed environments use the official
# luau-analyze instead for syntax checking.
std = "roblox"

[lints]
unused_variable = "allow"
shadowing = "allow"
empty_if = "allow"
